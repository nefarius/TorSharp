name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly upstream-only test run (Tuesdays at 04:00 UTC) to detect when
    # Tor/Privoxy upstream distribution sites change their format or become
    # unavailable.  Results are visible in the Actions tab.
    - cron: "0 4 * * 2"
  workflow_dispatch:
    inputs:
      build_stable_version:
        type: boolean
        description: "Build the stable version of the package for release"
        required: false
        default: false
      run_sample:
        type: boolean
        description: "Run the sample app"
        required: false
        default: false
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled"
        required: false
        default: false

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022, windows-2025, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    env:
      TORSHARP_TEST_CACHE: ${{ github.workspace }}/tests/cache
      # Set only on the scheduled upstream-health run so the fetcher tests
      # exercise the upstream scrapers directly instead of the mirror.
      TORSHARP_RUN_UPSTREAM_TESTS: ${{ github.event_name == 'schedule' && 'true' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache test downloads
        uses: actions/cache@v4
        with:
          path: tests/cache
          # Use a monthly bucket so the cache refreshes at least once a month,
          # picking up new tool versions.  restore-keys falls back to a prior
          # month so warm runs still benefit from cached binaries.
          key: ${{ matrix.os }}-torsharp-test-${{ hashFiles('.github/workflows/build.yml') }}-${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
          restore-keys: |
            ${{ matrix.os }}-torsharp-test-${{ hashFiles('.github/workflows/build.yml') }}-
            ${{ matrix.os }}-torsharp-test-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Restore
        run: dotnet restore TorSharp.sln

      - name: Build
        run: dotnet build TorSharp.sln --configuration Release --no-restore

      - name: Install Privoxy runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          MANIFEST_URL="https://github.com/nefarius/TorSharp.Mirror/releases/latest/download/manifest.json"
          DEPS=$(curl -fsSL --connect-timeout 15 "$MANIFEST_URL" 2>/dev/null \
            | python3 -c "
          import json, sys
          try:
              m = json.load(sys.stdin)
              deps = m.get('privoxy', {}).get('linux-amd64', {}).get('runtimeDeps', [])
              print(' '.join(deps))
          except Exception:
              pass
          " 2>/dev/null || true)
          if [ -z "$DEPS" ]; then
            # Fallback: deps for Debian bullseye/bookworm-era Privoxy builds
            # (libmbedtls14 = mbedTLS 2.x, available on Ubuntu 22.04 and 24.04)
            DEPS="libbrotli1 libmbedtls14"
          fi
          echo "Installing Privoxy runtime deps: $DEPS"
          sudo apt-get update -q
          sudo apt-get install -y $DEPS

      - name: Run sample
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_sample }}
        run: |
          date
          dotnet run --project samples/TorSharp.Sandbox --framework net9.0

      - name: Setup tmate session (Linux)
        if: ${{ runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@v3

      - name: Test
        run: dotnet test TorSharp.sln --configuration Release --no-restore --no-build --logger "console;verbosity=normal" --blame-hang-timeout 30m

      - name: Format
        run: dotnet format TorSharp.sln --no-restore --verify-no-changes

      - name: Pack
        if: matrix.os == 'windows-2025'
        run: dotnet pack TorSharp.sln --configuration Release --no-restore --no-build
        env:
          BUILD_STABLE_VERSION: ${{ inputs.build_stable_version }}

      - name: Upload artifacts
        if: matrix.os == 'windows-2025'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/TorSharp/bin/Release/*.nupkg

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: windows-2025

    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Push artifacts
        run: dotnet nuget push packages\*.nupkg -s https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json -k ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
