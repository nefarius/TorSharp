name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  schedule:
    # Weekly upstream-only test run (Tuesdays at 04:00 UTC) to detect when
    # Tor/Privoxy upstream distribution sites change their format or become
    # unavailable.  Results are visible in the Actions tab.
    - cron: "0 4 * * 2"
  workflow_dispatch:
    inputs:
      build_stable_version:
        type: boolean
        description: "Build the stable version of the package for release"
        required: false
        default: false
      run_sample:
        type: boolean
        description: "Run the sample app"
        required: false
        default: false
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled"
        required: false
        default: false

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    env:
      TORPROXY_TEST_CACHE: ${{ github.workspace }}/tests/cache
      # Set only on the scheduled upstream-health run so the fetcher tests
      # exercise the upstream scrapers directly instead of the mirror.
      # Also gates the Privoxy runtime-dep install step — those libs are only
      # needed when the Privoxy-enabled E2E path runs (upstream/scheduled builds).
      TORPROXY_RUN_UPSTREAM_TESTS: ${{ github.event_name == 'schedule' && 'true' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute cache month token
        id: cache-month
        shell: bash
        run: echo "month=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"

      - name: Cache test downloads
        uses: actions/cache@v4
        with:
          path: tests/cache
          # Monthly bucket: same key for the whole calendar month so hot runs
          # reuse cached binaries.  restore-keys falls back to any prior month
          # so the first run of a new month still benefits from old downloads.
          key: ${{ matrix.os }}-torproxy-test-${{ hashFiles('src/TorProxy/TorProxy.csproj', 'Directory.Packages.props') }}-${{ steps.cache-month.outputs.month }}
          restore-keys: |
            ${{ matrix.os }}-torproxy-test-${{ hashFiles('src/TorProxy/TorProxy.csproj', 'Directory.Packages.props') }}-
            ${{ matrix.os }}-torproxy-test-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore TorProxy.sln

      - name: Build
        run: dotnet build TorProxy.sln --configuration Release --no-restore

      - name: Install Privoxy runtime dependencies (Linux)
        if: runner.os == 'Linux' && env.TORPROXY_RUN_UPSTREAM_TESTS == 'true'
        run: |
          MANIFEST_URL="https://github.com/nefarius/TorSharp.Mirror/releases/latest/download/manifest.json"
          # Fetch manifest; emit a visible warning (not a silent swallow) on failure.
          MANIFEST_JSON=""
          if ! MANIFEST_JSON=$(curl -fsSL --connect-timeout 15 "$MANIFEST_URL"); then
            echo "::warning::Could not fetch mirror manifest from $MANIFEST_URL — will use fallback deps" >&2
          fi
          # Parse runtimeDeps from the manifest; warn and leave DEPS empty on any error.
          DEPS=""
          if [ -n "$MANIFEST_JSON" ]; then
            DEPS=$(MANIFEST_JSON="$MANIFEST_JSON" python3 - <<'PYEOF'
          import json, os, sys
          try:
              m = json.loads(os.environ["MANIFEST_JSON"])
              deps = m.get("privoxy", {}).get("linux-amd64", {}).get("runtimeDeps", [])
              print(" ".join(deps))
          except Exception as exc:
              print(f"::warning::Could not parse manifest runtimeDeps: {exc}", file=sys.stderr)
          PYEOF
            )
          fi
          if [ -z "$DEPS" ]; then
            echo "::warning::Using built-in fallback Privoxy deps (mirror runtimeDeps unavailable)" >&2
            # Fallback: Debian bullseye/bookworm-era build deps
            # (libmbedtls14 = mbedTLS 2.x, present on Ubuntu 22.04 and 24.04)
            DEPS="libbrotli1 libmbedtls14"
          fi
          echo "Installing Privoxy runtime deps: $DEPS"
          sudo apt-get update -q
          sudo apt-get install -y $DEPS

      - name: Run sample
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_sample }}
        run: |
          date
          dotnet run --project samples/TorProxy.Sandbox --framework net10.0

      - name: Setup tmate session (Linux)
        if: ${{ runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3

      - name: Test
        shell: bash
        run: |
          # Run each target framework sequentially so parallel Tor/E2E hosts do not
          # exhaust ports or contend on the shared test download cache (net10.0 was
          # hanging at the first HttpCollection test when all three TFMs ran at once).
          for framework in net8.0 net9.0 net10.0; do
            dotnet test TorProxy.sln --configuration Release --no-restore --no-build --framework "$framework" --logger "console;verbosity=normal" --blame-hang-timeout 30m
          done

      - name: Format
        run: dotnet format TorProxy.sln --no-restore --verify-no-changes

      - name: Pack
        if: matrix.os == 'windows-2025'
        run: dotnet pack TorProxy.sln --configuration Release --no-restore --no-build
        env:
          BUILD_STABLE_VERSION: ${{ (inputs.build_stable_version == true) || startsWith(github.ref, 'refs/tags/v') }}

      - name: Upload artifacts
        if: matrix.os == 'windows-2025'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/TorProxy/bin/Release/*.nupkg
            artifacts/Nefarius.Utilities.TorProxy.DependencyInjection/bin/Release/*.nupkg

  publish-nuget-org:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: production

    permissions:
      id-token: write  # required for OIDC token issuance
      contents: read

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: packages
          path: packages

      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: nefarius

      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s globstar nullglob
          for f in packages/**/*.nupkg; do
            echo "Pushing $f"
            dotnet nuget push "$f" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: windows-2025

    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Push artifacts
        run: |
          Get-ChildItem -Path packages -Filter *.nupkg -Recurse |
            ForEach-Object {
              dotnet nuget push $_.FullName `
                -s https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json `
                -k ${{ secrets.GITHUB_TOKEN }} `
                --skip-duplicate
            }
